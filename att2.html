<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Маркировка товаров · тренажер</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #f5f7fc;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Segoe UI', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      padding: 12px;
    }

    .container {
      max-width: 1200px;
      width: 100%;
      background: white;
      border-radius: 28px;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.04), 0 4px 12px rgba(0, 0, 0, 0.02);
      padding: 20px 20px 24px;
    }

    h1 {
      font-weight: 500;
      font-size: 22px;
      letter-spacing: -0.3px;
      color: #1a2639;
      margin-bottom: 4px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .subhead {
      font-size: 13px;
      color: #5b677b;
      font-weight: 400;
      border-left: 3px solid #95CAFA;
      padding-left: 14px;
      margin-bottom: 16px;
      line-height: 1.3;
    }

    .columns {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-bottom: 12px;
    }

    .column {
      background: white;
      border-radius: 14px;
      border: 1.5px solid #eef2f7;
      padding: 8px 8px 10px;
      transition: border 0.15s;
    }

    .column-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      padding: 0 2px;
    }

    .column-header h2 {
      font-weight: 500;
      font-size: 13px;
      color: #1f2a3f;
      letter-spacing: -0.1px;
    }

    .badge {
      background: #f0f4fe;
      color: #1f3a6b;
      font-size: 11px;
      font-weight: 500;
      padding: 1px 8px;
      border-radius: 20px;
      border: 1px solid #d9e6fa;
    }

    .dropzone {
      min-height: 70px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      padding: 2px 0;
    }

    .card {
      background: white;
      border: 1.5px solid #95CAFA;
      border-radius: 12px;
      padding: 7px 10px;
      font-size: 12px;
      font-weight: 450;
      color: #1c263b;
      box-shadow: 0 1px 4px rgba(149, 202, 250, 0.06);
      cursor: grab;
      transition: transform 0.1s, box-shadow 0.15s, background 0.2s, border-color 0.2s;
      line-height: 1.25;
      letter-spacing: -0.05px;
      word-break: break-word;
    }

    .card:active {
      cursor: grabbing;
      box-shadow: 0 4px 10px rgba(149, 202, 250, 0.18);
      transform: scale(0.97);
    }

    .card.dragging {
      opacity: 0.3;
      transform: scale(0.94);
      box-shadow: 0 1px 4px rgba(0,0,0,0.03);
    }

    .card.correct {
      border-color: #2b8c5e;
      background: #e8f5ee;
      box-shadow: 0 1px 6px rgba(43, 140, 94, 0.1);
    }

    .card.wrong {
      border-color: #c73a3a;
      background: #fdeaea;
      box-shadow: 0 1px 6px rgba(199, 58, 58, 0.1);
    }

    .column.drag-over .dropzone {
      background: #f2f9ff;
      border-radius: 8px;
      padding: 2px 2px;
    }

    .column.drag-over {
      border-color: #95CAFA;
      background: #fafdff;
    }

    .slider-section {
      margin-top: 4px;
      margin-bottom: 12px;
      background: #fafdff;
      border-radius: 18px;
      padding: 6px 10px 8px;
      border: 1.5px solid #e3edf9;
    }

    .slider-controls {
      display: flex;
      justify-content: flex-end;
      gap: 6px;
      margin-bottom: 4px;
    }

    .slider-btn {
      background: white;
      border: 1.5px solid #d9e2f0;
      border-radius: 24px;
      width: 28px;
      height: 28px;
      font-size: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: #1f2a40;
      transition: all 0.15s;
      font-weight: 300;
      line-height: 1;
      user-select: none;
    }

    .slider-btn:hover {
      background: #f2f7ff;
      border-color: #95CAFA;
    }

    .slider-btn:active {
      transform: scale(0.92);
    }

    .slider-btn:disabled {
      opacity: 0.2;
      pointer-events: none;
    }

    .slider-track-wrapper {
      overflow: hidden;
      border-radius: 14px;
      padding: 1px 0;
    }

    .slider-track {
      display: flex;
      gap: 6px;
      transition: transform 0.3s cubic-bezier(0.2, 0.9, 0.3, 1);
      padding: 2px 1px;
    }

    .slider-card {
      flex: 0 0 auto;
      width: 150px;
      background: white;
      border: 1.5px solid #95CAFA;
      border-radius: 14px;
      padding: 8px 12px;
      font-size: 12px;
      font-weight: 450;
      color: #1c263b;
      box-shadow: 0 1px 4px rgba(149, 202, 250, 0.04);
      cursor: grab;
      transition: transform 0.1s, box-shadow 0.15s, background 0.2s, border-color 0.2s;
      line-height: 1.25;
      letter-spacing: -0.05px;
      word-break: break-word;
      min-height: 44px;
      display: flex;
      align-items: center;
    }

    .slider-card:active {
      cursor: grabbing;
      box-shadow: 0 4px 10px rgba(149, 202, 250, 0.14);
      transform: scale(0.97);
    }

    .slider-card.dragging {
      opacity: 0.25;
      transform: scale(0.93);
    }

    .slider-card.empty-message {
      border-style: dashed;
      border-color: #d0dcee;
      color: #7a88a0;
      background: #f8fbff;
      cursor: default;
      justify-content: center;
      font-weight: 400;
      width: 100%;
      min-height: 40px;
      padding: 6px 12px;
    }

    .slider-card.empty-message:active {
      transform: none;
      box-shadow: none;
      cursor: default;
    }

    .slider-card.correct {
      border-color: #2b8c5e;
      background: #e8f5ee;
    }

    .slider-card.wrong {
      border-color: #c73a3a;
      background: #fdeaea;
    }

    .footer-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      border-top: 1px solid #eef3f9;
      padding-top: 14px;
      margin-top: 2px;
      flex-wrap: wrap;
      align-items: center;
    }

    .btn {
      background: white;
      border: 1.5px solid #d9e2f0;
      padding: 6px 18px;
      border-radius: 40px;
      font-family: inherit;
      font-size: 13px;
      font-weight: 480;
      color: #1f2a40;
      cursor: pointer;
      transition: all 0.15s;
      letter-spacing: -0.05px;
      min-width: 80px;
      text-align: center;
    }

    .btn-primary {
      background: #1f3a6b;
      border-color: #1f3a6b;
      color: white;
      box-shadow: 0 2px 8px rgba(31, 58, 107, 0.08);
    }

    .btn-primary:hover {
      background: #2b4a7e;
      border-color: #2b4a7e;
      box-shadow: 0 4px 12px rgba(31, 58, 107, 0.12);
      transform: translateY(-1px);
    }

    .btn-primary:active {
      transform: translateY(0);
    }

    .btn-primary.success {
      background: #2b8c5e;
      border-color: #2b8c5e;
    }

    .btn-primary.partial {
      background: #c77d1e;
      border-color: #c77d1e;
    }

    .btn-outline {
      background: transparent;
      border-color: #d0dcee;
    }

    .btn-outline:hover {
      background: #f2f7ff;
      border-color: #95CAFA;
    }

    .reset-btn {
      margin-right: auto;
    }

    @media (max-width: 1024px) {
      .columns {
        grid-template-columns: repeat(2, 1fr);
        gap: 8px;
      }
      .container {
        padding: 16px 14px 18px;
      }
      .slider-card {
        width: 130px;
      }
    }

    @media (max-width: 640px) {
      .columns {
        grid-template-columns: 1fr;
        gap: 6px;
      }
      .container {
        padding: 12px 10px 14px;
        border-radius: 20px;
      }
      h1 {
        font-size: 18px;
      }
      .footer-actions {
        flex-direction: column;
        align-items: stretch;
        gap: 8px;
      }
      .reset-btn {
        margin-right: 0;
      }
      .slider-card {
        width: 110px;
        font-size: 11px;
        padding: 6px 10px;
        min-height: 36px;
      }
      .slider-controls {
        justify-content: center;
      }
      .card {
        font-size: 11px;
        padding: 6px 8px;
      }
      .column-header h2 {
        font-size: 12px;
      }
      .btn {
        min-width: 60px;
        font-size: 12px;
        padding: 5px 14px;
      }
    }
  </style>
</head>
<body>
<div class="container">
  <h1>📦 Маркировка товаров</h1>
  <div class="subhead">
    Перетащите карточку в колонку с нужной датой
  </div>

  <div class="columns" id="columnsContainer">
    <!-- 4 колонки -->
  </div>

  <!-- Слайдер -->
  <div class="slider-section" id="sliderSection">
    <div class="slider-controls">
      <button class="slider-btn" id="sliderPrev">‹</button>
      <button class="slider-btn" id="sliderNext">›</button>
    </div>
    <div class="slider-track-wrapper">
      <div class="slider-track" id="sliderTrack"></div>
    </div>
  </div>

  <div class="footer-actions">
    <button class="btn btn-outline reset-btn" id="resetBtn">↻ Сбросить</button>
    <button class="btn btn-primary" id="checkBtn">✓ Проверить</button>
  </div>
</div>

<script>
  (function() {
    const COLUMN_DATES = [
      { id: 'sep', label: '1 сентября', date: '2026-09-01' },
      { id: 'oct', label: '1 октября', date: '2026-10-01' },
      { id: 'nov', label: '1 ноября', date: '2026-11-01' },
      { id: 'dec', label: '1 декабря', date: '2026-12-01' }
    ];

    const ITEMS_DATA = [
      { id: 'item1', name: 'Бакалея', correctDate: '2026-09-01' },
      { id: 'item2', name: 'Консервы', correctDate: '2026-10-01' },
      { id: 'item3', name: 'Растительное масло', correctDate: '2026-11-01' },
      { id: 'item4', name: 'Строительные материалы', correctDate: '2026-12-01' },
      { id: 'item5', name: 'Корм для животных', correctDate: '2026-12-01' },
      { id: 'item6', name: 'Молочная продукция', correctDate: '2026-11-01' },
      { id: 'item7', name: 'Кондитерская продукция', correctDate: '2026-11-01' },
      { id: 'item8', name: 'Мясные изделия', correctDate: '2026-11-01' }
    ];

    let state = { sep: [], oct: [], nov: [], dec: [], none: [] };
    let checked = false;

    const columnsContainer = document.getElementById('columnsContainer');
    const resetBtn = document.getElementById('resetBtn');
    const checkBtn = document.getElementById('checkBtn');
    const sliderTrack = document.getElementById('sliderTrack');
    const sliderPrev = document.getElementById('sliderPrev');
    const sliderNext = document.getElementById('sliderNext');

    let sliderOffset = 0;
    const cardWidth = 156;
    let visibleCards = 0;

    const dateToColumnId = {
      '2026-09-01': 'sep',
      '2026-10-01': 'oct',
      '2026-11-01': 'nov',
      '2026-12-01': 'dec'
    };

    function resetState() {
      state.sep = [];
      state.oct = [];
      state.nov = [];
      state.dec = [];
      state.none = ITEMS_DATA.map(item => item.id);
      checked = false;
      renderAll();
      checkBtn.textContent = '✓ Проверить';
      checkBtn.className = 'btn btn-primary';
      sliderOffset = 0;
      updateSlider();
    }

    function renderColumns() {
      columnsContainer.innerHTML = '';
      COLUMN_DATES.forEach(col => {
        const colDiv = document.createElement('div');
        colDiv.className = 'column';
        colDiv.dataset.columnId = col.id;

        const header = document.createElement('div');
        header.className = 'column-header';
        const h2 = document.createElement('h2');
        h2.textContent = col.label;
        const badge = document.createElement('span');
        badge.className = 'badge';
        badge.textContent = state[col.id] ? state[col.id].length : 0;
        header.appendChild(h2);
        header.appendChild(badge);

        const dropzone = document.createElement('div');
        dropzone.className = 'dropzone';

        const itemsInColumn = state[col.id] || [];
        itemsInColumn.forEach(itemId => {
          const item = ITEMS_DATA.find(it => it.id === itemId);
          if (item) {
            const card = createCardElement(item, true);
            dropzone.appendChild(card);
          }
        });

        colDiv.appendChild(header);
        colDiv.appendChild(dropzone);
        columnsContainer.appendChild(colDiv);

        colDiv.addEventListener('dragover', handleDragOver);
        colDiv.addEventListener('dragenter', handleDragEnter);
        colDiv.addEventListener('dragleave', handleDragLeave);
        colDiv.addEventListener('drop', handleDrop);
      });
    }

    function createCardElement(item, isColumn = false) {
      const card = document.createElement('div');
      card.className = isColumn ? 'card' : 'slider-card';
      card.draggable = true;
      card.textContent = item.name;
      card.dataset.itemId = item.id;
      card.dataset.correctDate = item.correctDate || '';

      if (checked) {
        applyCardStyle(card, item.id);
      }

      card.addEventListener('dragstart', (e) => {
        e.dataTransfer.setData('text/plain', item.id);
        card.classList.add('dragging');
      });

      card.addEventListener('dragend', (e) => {
        card.classList.remove('dragging');
        document.querySelectorAll('.column').forEach(el => el.classList.remove('drag-over'));
      });

      return card;
    }

    function applyCardStyle(card, itemId) {
      const item = ITEMS_DATA.find(it => it.id === itemId);
      if (!item) return;

      let currentCol = null;
      for (const colId of ['sep', 'oct', 'nov', 'dec', 'none']) {
        if (state[colId] && state[colId].includes(itemId)) {
          currentCol = colId;
          break;
        }
      }

      const correctDate = item.correctDate;
      let isCorrect = false;
      if (correctDate === null) {
        isCorrect = (currentCol === 'none');
      } else {
        const expectedCol = dateToColumnId[correctDate];
        isCorrect = (currentCol === expectedCol);
      }

      card.classList.remove('correct', 'wrong');
      if (isCorrect) {
        card.classList.add('correct');
      } else {
        card.classList.add('wrong');
      }
    }

    function updateSlider() {
      const availableIds = state.none || [];
      sliderTrack.innerHTML = '';

      if (availableIds.length === 0) {
        const emptyMsg = document.createElement('div');
        emptyMsg.className = 'slider-card empty-message';
        emptyMsg.textContent = 'Вы распределили все товары';
        emptyMsg.draggable = false;
        sliderTrack.appendChild(emptyMsg);
        sliderPrev.disabled = true;
        sliderNext.disabled = true;
        return;
      }

      availableIds.forEach(itemId => {
        const item = ITEMS_DATA.find(it => it.id === itemId);
        if (item) {
          const card = createCardElement(item, false);
          sliderTrack.appendChild(card);
        }
      });

      const wrapperWidth = sliderTrack.parentElement.clientWidth;
      visibleCards = Math.floor(wrapperWidth / cardWidth);
      if (visibleCards < 1) visibleCards = 1;

      const maxOffset = Math.max(0, availableIds.length - visibleCards);
      if (sliderOffset > maxOffset) sliderOffset = maxOffset;
      if (sliderOffset < 0) sliderOffset = 0;

      sliderTrack.style.transform = `translateX(-${sliderOffset * cardWidth}px)`;

      sliderPrev.disabled = (sliderOffset <= 0);
      sliderNext.disabled = (sliderOffset >= maxOffset);
    }

    function renderAll() {
      renderColumns();
      updateSlider();
      document.querySelectorAll('.column').forEach(col => {
        const colId = col.dataset.columnId;
        const badge = col.querySelector('.badge');
        if (badge && colId) {
          badge.textContent = state[colId].length;
        }
      });
    }

    function handleDragOver(e) {
      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';
    }

    function handleDragEnter(e) {
      e.preventDefault();
      e.currentTarget.classList.add('drag-over');
    }

    function handleDragLeave(e) {
      e.currentTarget.classList.remove('drag-over');
    }

    function handleDrop(e) {
      e.preventDefault();
      const column = e.currentTarget;
      column.classList.remove('drag-over');

      const itemId = e.dataTransfer.getData('text/plain');
      if (!itemId) return;

      const columnId = column.dataset.columnId;
      if (!columnId) return;

      moveItemToColumn(itemId, columnId);
    }

    function moveItemToColumn(itemId, targetColumnId) {
      if (state.none.includes(itemId)) {
        state.none = state.none.filter(id => id !== itemId);
        state[targetColumnId].push(itemId);
      } else {
        let sourceCol = null;
        for (const colId of ['sep', 'oct', 'nov', 'dec']) {
          if (state[colId].includes(itemId)) {
            sourceCol = colId;
            break;
          }
        }
        if (!sourceCol) return;
        if (sourceCol === targetColumnId) return;
        state[sourceCol] = state[sourceCol].filter(id => id !== itemId);
        state[targetColumnId].push(itemId);
      }

      checked = false;
      checkBtn.textContent = '✓ Проверить';
      checkBtn.className = 'btn btn-primary';
      renderAll();
    }

    function checkAnswers() {
      checked = true;
      let correct = 0;
      const total = ITEMS_DATA.length;

      document.querySelectorAll('.card, .slider-card').forEach(card => {
        const itemId = card.dataset.itemId;
        if (itemId) {
          applyCardStyle(card, itemId);
        }
      });

      for (const item of ITEMS_DATA) {
        const itemId = item.id;
        const correctDate = item.correctDate;

        let currentCol = null;
        for (const colId of ['sep', 'oct', 'nov', 'dec', 'none']) {
          if (state[colId] && state[colId].includes(itemId)) {
            currentCol = colId;
            break;
          }
        }

        let isCorrect = false;
        if (correctDate === null) {
          isCorrect = (currentCol === 'none');
        } else {
          const expectedCol = dateToColumnId[correctDate];
          isCorrect = (currentCol === expectedCol);
        }
        if (isCorrect) correct++;
      }

      const allCorrect = (correct === total);
      
      if (allCorrect) {
        checkBtn.textContent = `✅ Все ${total} верно`;
        checkBtn.className = 'btn btn-primary success';
      } else {
        checkBtn.textContent = `🔍 ${correct} из ${total}`;
        checkBtn.className = 'btn btn-primary partial';
      }
    }

    resetBtn.addEventListener('click', resetState);
    checkBtn.addEventListener('click', checkAnswers);

    sliderPrev.addEventListener('click', () => {
      if (sliderOffset > 0) {
        sliderOffset--;
        updateSlider();
      }
    });

    sliderNext.addEventListener('click', () => {
      const availableIds = state.none || [];
      const maxOffset = Math.max(0, availableIds.length - visibleCards);
      if (sliderOffset < maxOffset) {
        sliderOffset++;
        updateSlider();
      }
    });

    let resizeTimeout;
    window.addEventListener('resize', () => {
      clearTimeout(resizeTimeout);
      resizeTimeout = setTimeout(() => updateSlider(), 100);
    });

    resetState();
  })();
</script>
</body>
</html>
