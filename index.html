<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Тренажер НДС</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #eef2f7;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', 'Inter', system-ui, sans-serif;
            padding: 0.75rem;
        }

        .quiz-container {
            max-width: 680px;
            width: 100%;
            background: #ffffff;
            border-radius: 1.5rem;
            box-shadow: 0 10px 25px -8px rgba(0, 0, 0, 0.10);
            overflow: hidden;
            transition: all 0.2s ease;
        }

        .quiz-header {
            padding: 0.6rem 1.2rem 0.4rem 1.2rem;
            border-bottom: 1px solid rgba(149, 202, 250, 0.25);
            background: #fefefe;
        }

        .progress-area {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 0.3rem;
        }

        .question-counter {
            font-size: 0.7rem;
            font-weight: 500;
            color: #2c3e50;
            background: #eef4fc;
            padding: 0.1rem 0.7rem;
            border-radius: 30px;
        }

        .score-badge {
            font-size: 0.7rem;
            font-weight: 600;
            color: #1e4663;
            background: #eef4fc;
            padding: 0.1rem 0.7rem;
            border-radius: 30px;
        }

        .question-area {
            padding: 0.9rem 1.2rem 0.6rem 1.2rem;
        }

        .question-text {
            font-size: 0.95rem;
            font-weight: 500;
            line-height: 1.35;
            color: #0b2b3f;
            margin-bottom: 0.8rem;
            border-left: 3px solid #95CAFA;
            padding-left: 0.7rem;
        }

        .options-list {
            display: flex;
            flex-direction: column;
            gap: 0.45rem;
            margin-bottom: 0.8rem;
        }

        .option-item {
            border: 1.5px solid #95CAFA;
            border-radius: 1rem;
            padding: 0.45rem 0.9rem;
            background: #ffffff;
            transition: all 0.12s ease;
            cursor: pointer;
            display: flex;
            align-items: flex-start;
            gap: 0.6rem;
            font-size: 0.85rem;
            line-height: 1.3;
            color: #1f3b4c;
        }

        .option-item:hover {
            background: #f8fcff;
            border-color: #6fb0e0;
        }

        .option-radio {
            appearance: none;
            -webkit-appearance: none;
            width: 0.95rem;
            height: 0.95rem;
            border: 2px solid #95CAFA;
            border-radius: 50%;
            margin-top: 0.05rem;
            position: relative;
            cursor: pointer;
            background: white;
            transition: 0.1s;
            flex-shrink: 0;
        }
        .option-radio:checked {
            border-color: #2c7ab1;
            background-color: #2c7ab1;
            box-shadow: inset 0 0 0 2.5px white;
        }
        .option-radio:focus {
            outline: none;
        }

        .option-text {
            flex: 1;
            font-weight: 500;
        }

        .option-item.correct-highlight {
            background-color: #e0f7e8;
            border-color: #2b8c5e;
        }
        .option-item.wrong-highlight {
            background-color: #ffe7e7;
            border-color: #d9534f;
        }

        .actions {
            padding: 0 1.2rem 0.8rem 1.2rem;
            display: flex;
            gap: 0.6rem;
            justify-content: flex-end;
        }

        button {
            font-family: inherit;
            font-weight: 600;
            font-size: 0.8rem;
            padding: 0.4rem 1.2rem;
            border-radius: 2.5rem;
            border: none;
            cursor: pointer;
            transition: all 0.12s;
            background: #f0f4f9;
            color: #1f4e6e;
            box-shadow: 0 1px 2px rgba(0,0,0,0.03);
        }

        .btn-primary {
            background: #2c7ab1;
            color: white;
            box-shadow: 0 3px 6px rgba(44,122,177,0.12);
        }
        .btn-primary:hover {
            background: #1f6190;
            transform: translateY(-1px);
        }
        .btn-secondary {
            background: #eef2f7;
            border: 1px solid #cbdbe2;
        }
        .btn-secondary:hover {
            background: #e2e8f0;
        }

        .explanation-box {
            margin: 0 1.2rem 0.6rem 1.2rem;
            background: #f9fdfe;
            border-radius: 0.9rem;
            padding: 0.6rem 1rem;
            border-left: 3px solid #95CAFA;
            font-size: 0.8rem;
            color: #1e4663;
            line-height: 1.35;
        }

        .result-screen {
            text-align: center;
            padding: 1.5rem 1.2rem 2rem;
        }

        .result-icon {
            font-size: 2.2rem;
            margin-bottom: 0.2rem;
        }

        .result-title {
            font-size: 1.3rem;
            font-weight: 700;
            margin-bottom: 0.2rem;
            color: #1a2c3e;
        }

        .result-message {
            font-size: 0.9rem;
            margin-bottom: 1rem;
            color: #2c3e50;
        }

        .result-score {
            font-size: 1rem;
            font-weight: 600;
            background: #eef4fc;
            display: inline-block;
            padding: 0.3rem 1.2rem;
            border-radius: 60px;
            margin-bottom: 1.2rem;
            color: #1f6190;
        }

        @media (max-width: 480px) {
            .question-text { font-size: 0.88rem; padding-left: 0.5rem; }
            .option-item { padding: 0.4rem 0.7rem; font-size: 0.8rem; }
            .actions { padding: 0 0.8rem 0.6rem 0.8rem; justify-content: stretch; }
            .actions button { flex: 1; }
            .explanation-box { margin: 0 0.8rem 0.5rem 0.8rem; font-size: 0.75rem; }
            .quiz-header { padding: 0.4rem 0.8rem 0.3rem 0.8rem; }
            .question-area { padding: 0.6rem 0.8rem 0.4rem 0.8rem; }
        }
    </style>
</head>
<body>

<div class="quiz-container" id="app"></div>

<script>
    // === ВОПРОСЫ ===
    const RAW_QUESTIONS = [
        {
            text: "1. Ваша компания продает медицинские товары. На изделие есть регистрационное удостоверение с кодом ОКПД 2, которого нет в Постановлении Правительства от 30.09.2015 № 1042. Будете ли вы начислять по этому товару НДС?",
            options: [
                "Нет, потому что медицинские товары — это льготная категория.",
                "Да, начислю НДС по общей ставке, так как кода на этот товар нет в перечне правительства.",
                "Да, начислю по ставке 10%, потому что медицинские товары попадают под льготную категорию."
            ],
            correctIndex: 1,
            explanation: "Правильный ответ: если медицинских товаров нет в Постановлении Правительства от 30.09.2015 № 1042, начисляйте НДС по общей ставке."
        },
        {
            text: "2. Ваша компания оказывает косметологические услуги в медицинском центре. У организации есть лицензия на медицинскую деятельность. Клиент оплатил процедуру «аппаратный пилинг кожи». Начислите ли вы НДС по такой операции?",
            options: [
                "Да, начислю, потому что косметологическим услугам всегда начисляют НДС.",
                "Нет, НДС начислять не буду, потому что по этим услугам налог не начисляют при условии, что есть лицензия и они в перечне медицинских услуг.",
                "Нет, НДС не начислю, потому что продаем услугу физическому лицу."
            ],
            correctIndex: 1,
            explanation: "Правильный ответ: косметологические услуги освобождены от НДС, если у вашей компании есть лицензия и эти процедуры входят в перечень из пп. 2 пункта 2 статьи 149 НК."
        },
        {
            text: "3. Ваша компания оказывает физкультурно-оздоровительные услуги клиентам и часть помещений сдает в аренду. Кроме того, есть отдельное направление — баня и сауна для посетителей. По каким операциям вы начислите НДС?",
            options: [
                "Начислю налог по услугам бани и сауны, так как это оздоровительные услуги, и по аренде.",
                "Начислю только по аренде помещений, а по физкультурно-оздоровительным услугам и бане с сауной НДС не будет.",
                "Не буду начислять НДС, потому что все операции связаны со спортом и оздоровлением."
            ],
            correctIndex: 0,
            explanation: "Пояснение: если ваша компания оказывает физкультурно-оздоровительные услуги, воспользуйтесь льготой и не начисляйте НДС. Баня и сауна — это оздоровительные услуги, и тут льготу применить уже нельзя. Аренда помещений — это отдельная услуга, по которой начислите налог."
        },
        {
            text: "4. Ваша компания применяет льготу по общепиту в 2026 году. По данным регистров налогового учета доходы за год без учета сумм НДС и акцизов составили: общая сумма доходов — 570 млн руб.; сумма доходов от услуг общественного питания — 410 млн руб. Определите, положено ли освобождение по НДС вашей компании в 2027 году.",
            options: [
                "Да, положено, так как удельный вес доходов от услуг общепита за 2026 год составляет 71,93%, но также я проверю, чтобы среднемесячная зарплата сотрудников была не ниже региональной среднемесячной зарплаты.",
                "Нет, компания не освобождена от налога, потому что общая сумма доходов превысила 500 млн руб.",
                "Нет, льгота не положена, потому что доходы от услуг общепита должны составлять не менее 90% общей выручки за 2026 год, а среднемесячная зарплата работников — не ниже федерального МРОТ."
            ],
            correctIndex: 0,
            explanation: "Пояснение: вашей компании положена льгота, так как вы выполнили условия для нее, и удельный вес доходов от услуг общественного питания в общей сумме доходов составляет 71,93%. Дополнительно проверьте, не ниже ли среднемесячная заработная плата работников среднемесячной зарплаты в вашем регионе. Если условия выполнили, то вы освобождены от НДС в 2027 году."
        },
        {
            text: "5. Ваша компания оказывает услуги общепита в столовой. При этом у компании есть отдельный розничный магазин, где вы продаёте готовую продукцию. Ещё в столовой стоят вендинговые автоматы, через которые продают напитки и снеки. По каким операциям вы начислите НДС?",
            options: [
                "НДС начислю по всем продажам в розничном магазине и по реализации через вендинговые автоматы.",
                "Не буду начислять НДС, так как все операции попадают под льготу по общепиту.",
                "НДС начислю только по продажам через вендинговые автоматы.",
                "НДС начислю только по операциям в розничном магазине."
            ],
            correctIndex: 0,
            explanation: "Льготу применяйте только к услугам общепита в столовой, по розничным продажам и вендинговым автоматам начисляйте НДС по общим правилам."
        },
        {
            text: "6. Ваша компания проводит рекламную акцию и раздает клиентам подарки с логотипом. Стоимость одного подарка с НДС — 280 руб. Подарки передают бесплатно. Компания ведет раздельный учет НДС. Начислите ли вы НДС, когда передадите подарки?",
            options: [
                "НДС начислю обязательно, так как товары, которые передали безвозмездно, облагаются налогом.",
                "НДС начислю по нулевой ставке, так как это рекламные подарки.",
                "Не буду начислять НДС, так как стоимость одного подарка не превышает 300 руб. с учетом НДС."
            ],
            correctIndex: 2,
            explanation: "Пояснение: если вы передаете безвозмездно рекламные подарки и их стоимость до 300 руб. в том числе НДС, не начисляйте по таким операциям налог. Чтобы применить такую льготу, ведите раздельный учет и включите входной НДС в стоимость товаров."
        }
    ];

    // === ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ ===
    function shuffleArray(arr) {
        for (let i = arr.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr;
    }

    function buildShuffledQuestions() {
        return RAW_QUESTIONS.map(q => {
            const optsWithIndex = q.options.map((optText, idx) => ({ text: optText, originalIndex: idx }));
            const shuffledOpts = shuffleArray([...optsWithIndex]);
            let newCorrectIndex = -1;
            for (let i = 0; i < shuffledOpts.length; i++) {
                if (shuffledOpts[i].originalIndex === q.correctIndex) {
                    newCorrectIndex = i;
                    break;
                }
            }
            return {
                text: q.text,
                options: shuffledOpts.map(item => item.text),
                correctIndex: newCorrectIndex,
                explanation: q.explanation
            };
        });
    }

    let CURRENT_QUESTIONS = buildShuffledQuestions();

    let currentState = {
        phase: 'quiz',
        currentQuestionIdx: 0,
        userAnswers: [],
        explanationForCurrent: null,
        isAnswerChecked: false,
        selectedOptionTemp: null,
        totalQuestions: CURRENT_QUESTIONS.length
    };

    const appContainer = document.getElementById('app');

    function resetAndRestart() {
        CURRENT_QUESTIONS = buildShuffledQuestions();
        currentState = {
            phase: 'quiz',
            currentQuestionIdx: 0,
            userAnswers: [],
            explanationForCurrent: null,
            isAnswerChecked: false,
            selectedOptionTemp: null,
            totalQuestions: CURRENT_QUESTIONS.length
        };
        render();
    }

    function getCorrectCount() {
        let correct = 0;
        for (let i = 0; i < currentState.userAnswers.length; i++) {
            if (currentState.userAnswers[i] && currentState.userAnswers[i].isCorrect) correct++;
        }
        return correct;
    }

    function allQuestionsAnswered() {
        return currentState.userAnswers.length === CURRENT_QUESTIONS.length &&
               currentState.userAnswers.every(a => a !== undefined);
    }

    function showFinalResult() {
        const correctCount = getCorrectCount();
        const total = CURRENT_QUESTIONS.length;
        const allCorrect = (correctCount === total);

        let icon = allCorrect ? '🏆✨' : '📘';
        let title = allCorrect ? 'Отлично!' : 'Результат';
        let message = allCorrect ? 'Вы правильно ответили на все вопросы!' : 'Попробуйте выполнить задание заново.';

        const resultHtml = `
            <div class="quiz-header">
                <div class="progress-area">
                    <span class="question-counter">Итог</span>
                    <span class="score-badge">${correctCount}/${total}</span>
                </div>
            </div>
            <div class="result-screen">
                <div class="result-icon">${icon}</div>
                <div class="result-title">${title}</div>
                <div class="result-score">${correctCount} из ${total}</div>
                <div class="result-message">${message}</div>
                <button class="btn-primary" id="restartBtn">Пройти заново</button>
            </div>
        `;

        appContainer.innerHTML = resultHtml;
        const restartBtn = document.getElementById('restartBtn');
        if (restartBtn) restartBtn.addEventListener('click', () => resetAndRestart());
    }

    function handleNext() {
        const nextIdx = currentState.currentQuestionIdx + 1;
        if (nextIdx >= CURRENT_QUESTIONS.length) {
            showFinalResult();
            return;
        }
        currentState.currentQuestionIdx = nextIdx;
        currentState.phase = 'quiz';
        currentState.isAnswerChecked = false;
        currentState.explanationForCurrent = null;
        const saved = currentState.userAnswers[nextIdx];
        currentState.selectedOptionTemp = saved ? saved.selectedIdx : null;
        render();
    }

    function handleCheck() {
        if (currentState.isAnswerChecked) return;
        const selected = currentState.selectedOptionTemp;
        if (selected === null) {
            alert("Пожалуйста, выберите вариант ответа.");
            return;
        }
        const idx = currentState.currentQuestionIdx;
        const isCorrect = (selected === CURRENT_QUESTIONS[idx].correctIndex);
        if (!currentState.userAnswers[idx]) {
            currentState.userAnswers[idx] = { selectedIdx: selected, isCorrect: isCorrect };
        } else {
            currentState.userAnswers[idx].selectedIdx = selected;
            currentState.userAnswers[idx].isCorrect = isCorrect;
        }
        currentState.isAnswerChecked = true;
        currentState.explanationForCurrent = CURRENT_QUESTIONS[idx].explanation;
        currentState.phase = 'explanation';
        render();
    }

    function selectOption(optionIndex) {
        if (currentState.phase !== 'quiz') return;
        if (currentState.isAnswerChecked) return;
        currentState.selectedOptionTemp = optionIndex;
        render();
    }

    function escapeHtml(str) {
        let result = str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
        return result;
    }

    function render() {
        if (!appContainer) return;
        if (allQuestionsAnswered() && currentState.currentQuestionIdx >= CURRENT_QUESTIONS.length) {
            showFinalResult();
            return;
        }

        const total = CURRENT_QUESTIONS.length;
        const qIdx = currentState.currentQuestionIdx;
        const question = CURRENT_QUESTIONS[qIdx];
        const isCheckedPhase = (currentState.phase === 'explanation');
        const savedAnswer = currentState.userAnswers[qIdx];
        let selectedIdx = currentState.selectedOptionTemp;

        let highlightMap = {};
        if (isCheckedPhase && savedAnswer) {
            const correctIdx = question.correctIndex;
            const userSelected = savedAnswer.selectedIdx;
            highlightMap[correctIdx] = 'correct';
            if (userSelected !== correctIdx) {
                highlightMap[userSelected] = 'wrong';
            }
        }

        let optionsHtml = '';
        question.options.forEach((opt, idx) => {
            let additionalClass = '';
            if (highlightMap[idx] === 'correct') additionalClass = 'correct-highlight';
            if (highlightMap[idx] === 'wrong') additionalClass = 'wrong-highlight';
            const isCheckedAttr = (selectedIdx === idx) ? 'checked' : '';
            const disabledAttr = (isCheckedPhase) ? 'disabled' : '';
            optionsHtml += `
                <div class="option-item ${additionalClass}" data-opt-index="${idx}">
                    <input type="radio" name="questionOption" class="option-radio" value="${idx}" id="opt_${idx}" ${isCheckedAttr} ${disabledAttr}>
                    <label for="opt_${idx}" class="option-text" style="cursor:pointer; flex:1;">${escapeHtml(opt)}</label>
                </div>
            `;
        });

        let explanationBlock = '';
        if (currentState.phase === 'explanation' && currentState.explanationForCurrent) {
            explanationBlock = `
                <div class="explanation-box">
                    <strong>📖 Пояснение</strong><br>
                    ${escapeHtml(currentState.explanationForCurrent)}
                </div>
            `;
        }

        let actionButtons = '';
        if (currentState.phase === 'quiz') {
            actionButtons = `
                <div class="actions">
                    <button class="btn-primary" id="checkBtn">✓ Проверить</button>
                </div>
            `;
        } else {
            actionButtons = `
                <div class="actions">
                    <button class="btn-primary" id="nextBtn">Далее →</button>
                </div>
            `;
        }

        const answeredCount = currentState.userAnswers.filter(a => a !== undefined).length;

        const headerHtml = `
            <div class="quiz-header">
                <div class="progress-area">
                    <span class="question-counter">Вопрос ${qIdx+1} из ${total}</span>
                    <span class="score-badge">✅ ${answeredCount}/${total}</span>
                </div>
            </div>
            <div class="question-area">
                <div class="question-text">${escapeHtml(question.text)}</div>
                <div class="options-list" id="optionsContainer">
                    ${optionsHtml}
                </div>
            </div>
            ${explanationBlock}
            ${actionButtons}
        `;

        appContainer.innerHTML = headerHtml;

        const optionDivs = document.querySelectorAll('.option-item');
        optionDivs.forEach(div => {
            const radio = div.querySelector('.option-radio');
            if (radio && !radio.disabled) {
                div.addEventListener('click', (e) => {
                    const idxAttr = div.getAttribute('data-opt-index');
                    if (idxAttr !== null && currentState.phase === 'quiz' && !currentState.isAnswerChecked) {
                        const idxNum = parseInt(idxAttr, 10);
                        selectOption(idxNum);
                        const radioInside = div.querySelector('.option-radio');
                        if (radioInside) radioInside.checked = true;
                    }
                });
            }
        });

        const radios = document.querySelectorAll('.option-radio');
        radios.forEach(radio => {
            radio.addEventListener('change', (e) => {
                if (currentState.phase === 'quiz' && !currentState.isAnswerChecked) {
                    const val = parseInt(e.target.value, 10);
                    selectOption(val);
                }
            });
        });

        const checkBtn = document.getElementById('checkBtn');
        if (checkBtn) checkBtn.addEventListener('click', handleCheck);
        const nextBtn = document.getElementById('nextBtn');
        if (nextBtn) nextBtn.addEventListener('click', handleNext);
    }

    render();
</script>
</body>
</html>
